name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & format (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + dev tools
        run: pip install -e ".[dev]"

      - name: ruff check (lint)
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

  typecheck:
    name: Type-check (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + dev tools
        run: pip install -e ".[dev]"

      - name: mypy
        run: mypy src/comfy_api_proxy

  spec-drift:
    name: Spec-drift check (models match spec/openapi.yaml)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + dev tools
        run: pip install -e ".[dev]"

      # Regenerate the pydantic models from the checked-in spec/openapi.yaml
      # into the real output path, then diff against git HEAD. A non-empty
      # diff means someone synced the spec (or hand-edited the generated
      # file) without regenerating models — fail the build rather than let
      # the two drift apart silently.
      - name: Regenerate models and diff against checked-in copy
        run: |
          python3 scripts/generate_models.py
          if ! git diff --exit-code -- src/comfy_api_proxy/schemas/_generated.py; then
            echo "::error::src/comfy_api_proxy/schemas/_generated.py is out of date." \
                 "Run 'python3 scripts/generate_models.py' and commit the result."
            exit 1
          fi
          echo "OK: generated models match spec/openapi.yaml."

  test:
    name: Test + e2e smoke (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev tools
        run: pip install -e ".[dev]"

      # tests/test_smoke.py drives the proxy directly over its own HTTP
      # surface (submit -> poll -> download) using only the standard library
      # (urllib) - no SDK, no other repo's credentials, no network dependency
      # beyond localhost. demo/run_demo.py (which uses the separate comfy-sdk
      # package) is the human-facing demo and is intentionally not exercised
      # here, so this repo's CI never depends on another repo's access token.
      - name: Run tests (includes the end-to-end smoke test)
        run: pytest -v
